language: en
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!dist/**"
    - "!**/*.generated.ts"
    - "!docs/api/**"
    - "!pnpm-lock.yaml"
    - "!inspiration/**"
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Public surface mirrors the YouTube IFrame Player API; flag deviations
        from `@types/youtube`. The package is dependency-free at runtime —
        flag any new runtime dep imports.
    - path: "test/**/*.ts"
      instructions: |
        Tests use vitest + jsdom. No real network calls; the YT iframe API
        must be mocked via `test/helpers/mockYT.ts`.
chat:
  auto_reply: true
