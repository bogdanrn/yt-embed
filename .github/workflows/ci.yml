name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:typecheck
      - run: pnpm build
      - name: Drift guard
        run: |
          pnpm generate
          git diff --exit-code \
            src/functionNames.generated.ts \
            src/eventCallbackNames.generated.ts \
            docs/methods.md \
            docs/events.md \
            README.md
